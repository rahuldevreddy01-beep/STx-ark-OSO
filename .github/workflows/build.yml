name: Build APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK & AAB
        run: gradle :app:assembleDebug :app:bundleDebug

      - name: Build Release AAB & APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            trap 'rm -f "$KEYSTORE_PATH"' EXIT
            printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_PATH"
            gradle :app:bundleRelease :app:assembleRelease
          else
            echo "Release keystore secrets not set; built debug APK and AAB only."
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stx-ark-oso-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab

      - name: Create GitHub Release with APK & AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          
          # Pick release APK/AAB if available, otherwise debug
          APK_FILE=""
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_FILE="app/build/outputs/apk/release/app-release.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          fi

          AAB_FILE=""
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            AAB_FILE="app/build/outputs/bundle/release/app-release.aab"
          elif [ -f "app/build/outputs/bundle/debug/app-debug.aab" ]; then
            AAB_FILE="app/build/outputs/bundle/debug/app-debug.aab"
          fi

          FILES=()
          [ -n "$APK_FILE" ] && FILES+=("$APK_FILE")
          [ -n "$AAB_FILE" ] && FILES+=("$AAB_FILE")

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No APK or AAB outputs found"
            exit 1
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "STx-ARK OSO Build #${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
            --notes "Automated APK & AAB build from commit ${SHORT_SHA} on branch ${GITHUB_REF_NAME}." \
            "${FILES[@]}"
